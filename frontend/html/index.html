<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Lumenova Cinema</title>
    <link rel="icon" type="image/png" href="../img/logo/lumenova.png">
</head>
<body>
    <header>
        <nav id="nav">
            <a href="#inicio">Inicio</a>
            <a href="#cartelera">Cartelera</a>
            <a href="#estrenos">Estrenos</a>
            <a href="#promos">Promos</a>
            <a href="#contacto">Contacto</a>
            <div class="botones-cuenta">
                <button type="button" onclick="location.href='#Iniciar sesión'">Iniciar sesión</button>
                <button type="button" onclick="location.href='#Registrarse'">Registrarse</button>
            </div>
        </nav>
    </header>
    <main>
        <section class="seccion-cartelera">
            <div class="carrusel-contenedor" aria-label="Carrusel de imágenes de películas">
                <button class="carrusel-btn anterior" type="button" aria-label="Anterior" onclick="cambiarImagen(-1)">&#10094;</button>
                <div class="carrusel-imagenes">
                    <img class="carrusel-slide activa" src="../img/carrusel de imagenes/backrooms.jpeg" alt="Imagen 1">
                    <img class="carrusel-slide" src="../img/carrusel de imagenes/deadpool.jpeg" alt="Imagen 2">
                    <img class="carrusel-slide" src="../img/carrusel de imagenes/longlegs.jpeg" alt="Imagen 3">
                    <img class="carrusel-slide" src="../img/carrusel de imagenes/spider-man home coming.jpeg" alt="Imagen 4">
                    <img class="carrusel-slide" src="../img/carrusel de imagenes/LaOdisea.jpg" alt="Imagen 5">
                    <img class="carrusel-slide" src="../img/carrusel de imagenes/The Boys Wallpaper.jpeg" alt="Imagen 6">
                    <img class="carrusel-slide" src="../img/carrusel de imagenes/the texas chainsaw massacre.jpeg" alt="Imagen 7">
                    <img class="carrusel-slide" src="../img/carrusel de imagenes/zootopia 2.jpeg" alt="Imagen 8">
                </div>
                <div class="carrusel-puntos" aria-label="Indicadores del carrusel">
                    <button class="carrusel-punto activo" type="button" data-index="0" aria-label="Ir a la imagen 1"></button>
                    <button class="carrusel-punto" type="button" data-index="1" aria-label="Ir a la imagen 2"></button>
                    <button class="carrusel-punto" type="button" data-index="2" aria-label="Ir a la imagen 3"></button>
                    <button class="carrusel-punto" type="button" data-index="3" aria-label="Ir a la imagen 4"></button>
                    <button class="carrusel-punto" type="button" data-index="4" aria-label="Ir a la imagen 5"></button>
                    <button class="carrusel-punto" type="button" data-index="5" aria-label="Ir a la imagen 6"></button>
                    <button class="carrusel-punto" type="button" data-index="6" aria-label="Ir a la imagen 7"></button>
                    <button class="carrusel-punto" type="button" data-index="7" aria-label="Ir a la imagen 8"></button>
                </div>
                <button class="carrusel-btn siguiente" type="button" aria-label="Siguiente" onclick="cambiarImagen(1)">&#10095;</button>
            </div>
            <div id="cartelera"></div><br>
            <div class="peliculas-container">
                <h2>Películas en cartelera</h2>
                <div class="peliculas-grid">
                    <article class="pelicula-card">
                        <img src="../img/peliculas/edwardScisssorhands.jpeg" alt="Edward Scisssorhands">
                        <div class="pelicula-info">
                            <h3>Edward Scisssorhands</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/frankenweenie.jpeg" alt="Frankenweenie">
                        <div class="pelicula-info">
                            <h3>Frankenweenie</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/laVerdadDelMal.jpeg" alt="La verdad del mal">
                        <div class="pelicula-info">
                            <h3>La verdad del mal</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/avengersInfinityWar.jpeg" alt="Avengers: Infinity War">
                        <div class="pelicula-info">
                            <h3>Avengers: Infinity War</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/masacreEnTexas.jpeg" alt="Masacre en Texas">
                        <div class="pelicula-info">
                            <h3>Masacre en Texas</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/paprika.jpeg" alt="Paprika">
                        <div class="pelicula-info">
                            <h3>Paprika</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/piratasDelCaribe_LaMaldiciónDeLaPerlaNegra.jpeg" alt="Piratas del Caribe">
                        <div class="pelicula-info">
                            <h3>Piratas del Caribe</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/superpoliDeCentroComercial.jpeg" alt="Superpoli de centro comercial">
                        <div class="pelicula-info">
                            <h3>Superpoli de centro comercial</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/robotSalvaje.jpeg" alt="Robot Salvaje">
                        <div class="pelicula-info">
                            <h3>Robot Salvaje</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/obsesion.jpeg" alt="Obsesión">
                        <div class="pelicula-info">
                            <h3>Obsesión</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/michaelJackson.jpeg" alt="Michael Jackson">
                        <div class="pelicula-info">
                            <h3>Michael Jackson</h3>
                            <p></p>
                        </div>
                    </article>
                    <article class="pelicula-card">
                        <img src="../img/peliculas/viernes13th.jpeg" alt="Viernes 13">
                        <div class="pelicula-info">
                            <h3>Viernes 13</h3>
                            <p></p>
                        </div>
                    </article>
                </div>
            </div>
        </section>
        <section id="estrenos" class="contenido-seccion">
            <h2>Estrenos</h2>
            <p></p>
        </section>
        <section id="contacto" class="contenido-seccion">
            <h2>Contacto</h2>
            <p></p>
        </section>
    </main>
    </footer>
    <script src="../js/script.js"></script>
</body>
</html>
